<!DOCTYPE html>
<html lang="fi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pohjois-Amerikka</title>
    <link rel="stylesheet" href="css/pohjoisamerikka.css">
</head>
<body>
    <header>
        <h1>Kuvia Pohjois-Amerikasta</h1>
    </header>

    <main>
        <section class="gallery-section">
            <h2>Kuvia Seattlesta</h2>
        
        <div class="gallery">
            <figure class="gallery-item">
                <img src="images/spaceneedle.jpg" alt="Space Needle -torni Seattlen spaceneedle"/> 
                <figcaption>Kaupungin kuuluisin nähtävyys, käveltiin muuten alas nuo rappuset</figcaption>
            </figure>
            <figure class="gallery-item">
                <img src="images/seattlefromcar.jpg" alt="Seattlen näkymä autosta"/> 
                <figcaption>Syksyistä maisemaa Seattlessa</figcaption>
            </figure>
        </div>
        </section>

            <section class="gallery-section">
        <header>
        <h2>Kuvia Los Angelesista</h2>
        </header>

        <div class="gallery">
            <figure class="gallery-item">
                <img src="images/losangeles1.jpg" alt="Hollywood kyltti Los Angelesissa"/> 
                <figcaption>Hollywood kyltti</figcaption>
            </figure>
            <figure class="gallery-item">       
                <img src="images/losangeles2.jpg" alt="Santa Monica- laituri Los Angelesissa"/> 
                <figcaption>Santa Monica- laituri</figcaption>
            </figure>
            <figure class="gallery-item">
                <img src="images/losangeles3.jpg" alt="Hollywood Boulevard katu Los Angelesissa"/> 
                <figcaption>Hollywood Boulevard</figcaption>
            </figure>
        </div>
        </section>

            <section class="gallery-section">
            <header>
                <h2>Kuvia Las Vegasista</h2>
            </header>
        <div class="gallery">
            <figure class="gallery-item">
                <img src="images/lasvegas1.jpg" alt="Las Vegas "/> 
                <figcaption>Hollywood kyltti</figcaption>
            </figure>
            <figure class="gallery-item">
                <img src="images/lasvegas2.jpg" alt="Santa Monica- laituri Las Vegasissa"/> 
                <figcaption>Santa Monica- laituri</figcaption>
            </figure>
            <figure class="gallery-item">
                <img src="images/lasvegas3.jpg" alt="Hollywood Boulevard Las Vegasissa"/> 
                <figcaption>Hollywood Boulevard</figcaption>
            </figure>
        </div>
        </section>
    </main>
</body>
</html>
