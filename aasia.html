<!DOCTYPE html>
<html lang="fi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aasia</title>
</head>
<body>
    <h1>Tähän tulee kuvia eri paikoista Aasiassa</h1>
    <link rel="stylesheet" href="css/aasia.css">

    <div class="container">
        <section class="intro">
        </section>
        <section class="gallery-section">
            <h2>Kuvia Kyprokselta</h2>
            <div class="gallery">
                <figure class="gallery-item">
                    <img src="images/kypros1.jpg" alt="a1"/>
                    <figcaption>Kypros, itse asiassa tämä on Nikosiasta, Euroopan puolta</figcaption>
                </figure>
                <figure class="gallery-item">
                    <img src="images/kypros2.jpg" alt="a2"/>
                    <figcaption>Kypros, hotellilta </figcaption>
                </figure>
                <figure class="gallery-item">
                    <img src="images/kypros3.jpg" alt="a3"/>
                    <figcaption>Kypros, Kyrenia Peace Monument</figcaption>
                </figure>
            </div>
              <h2>Kuvia Dubaista</h2>
                        <div class="gallery">
                <figure class="gallery-item">
                    <img src="images/dubai1.JPEG" alt="a1"/>
                    <figcaption>Pitihän se käydä maailman korkeimmassa rakennuksessa, Burj Kahlifassa</figcaption>
                </figure>
                <figure class="gallery-item">
                    <img src="images/dubai2.JPEG" alt="a2"/>
                    <figcaption>Hieno valopuisto</figcaption>
                </figure>
                <figure class="gallery-item">
                    <img src="images/dubai3.JPEG" alt="a3"/>

                </figure>
            </div>
