<!DOCTYPE html>

        <div class="gallery">

            <img src="images/lofootit2.jpg" alt="lf2"/>

            <img src="images/lofootit3.jpg" alt="lf3"/>

        </div>
        <section class="gallery-section">

        <div class="gallery">

            <img src="images/rodos1.jpg" alt="rh1"/>

            <img src="images/rodos2.jpg" alt="rh2"/>

           <img src="images/rodos3.jpg" alt="rh3"/>

        </section>

        </section>

        </section>
                <section class="gallery-section">

            <figure gallery-item></figure>

            <img src="images/skotlanti2.jpeg" alt="sk2"/>
